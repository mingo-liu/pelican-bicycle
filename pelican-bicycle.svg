  <path d="M490 491q21 3 35 19l-43 2z" fill="#e9a540" stroke="#263e40" stroke-width="4" stroke-linejoin="round"/>
  <path d="M466 538l29-33m-14 0h36" fill="none" stroke="#263e40" stroke-width="8" stroke-linecap="round"/>
  <!-- Diamond frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M405 389L293 526h173L405 389l240-12-179 149m179-149 78 149" stroke="#263e40" stroke-width="17"/>
    <path d="M405 389L293 526h173L405 389l240-12-179 149m179-149 78 149" stroke="#278f89" stroke-width="10"/>
