<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
  <title id="title">A pelican riding a bicycle</title>
  <desc id="desc">A cheerful white pelican with a long orange bill pedals a teal bicycle beneath a golden sun, on a warm cream background.</desc>
  <defs>
    <pattern id="spokes" width="1" height="1" patternContentUnits="objectBoundingBox">
      <path d="M.5 0V1M0 .5H1M.146 .146L.854 .854M.146 .854L.854 .146M.309 .038L.691 .962M.038 .309L.962 .691M.038 .691L.962 .309M.309 .962L.691 .038" fill="none" stroke="#afbbb0" stroke-width=".006"/>
    </pattern>
  </defs>
  <rect width="1000" height="800" rx="36" fill="#faf3e3"/>
  <circle cx="790" cy="170" r="74" fill="#f3cc66"/>
  <g fill="none" stroke="#d8dfcf" stroke-width="4" stroke-linecap="round">
