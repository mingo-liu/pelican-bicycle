  <path d="M542 229q-56-18-101-65l-5 30-30 1q57 48 130 54" fill="#dd6850" stroke="#263e40" stroke-width="4" stroke-linejoin="round"/>
  <path d="M531 224q25 15 59 4l5 18q-31 15-60-2z" fill="#ee7a5d" stroke="#263e40" stroke-width="4"/>
