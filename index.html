<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="一只迎着微风骑自行车的鹈鹕。">
<title>慢慢骑，风景会等你 · 风起鹈行</title>
<style>
:root { --paper: #faf3e3; --ink: #263e40; --teal: #278078; --muted: #61706a; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; background: var(--paper); color: var(--ink); font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
main { max-width: 1320px; min-height: 100svh; margin: auto; padding: 36px 6vw 24px; display: flex; flex-direction: column; }
.masthead { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; }
.masthead::before { content: ''; width: 10px; height: 10px; background: var(--teal); border-radius: 50%; }
.scene { flex: 1; display: grid; grid-template-columns: .8fr 1.6fr; align-items: center; gap: 12px; }
.copy { position: relative; z-index: 1; padding-bottom: 28px; }
h1 { margin: 0 0 24px; font-family: "STKaiti", "KaiTi", "Songti SC", serif; font-size: clamp(38px, 4.4vw, 64px); font-weight: 600; line-height: 1.35; letter-spacing: -.04em; }
.copy p { color: var(--muted); font-size: 16px; line-height: 1.95; margin: 0 0 30px; }
.art { min-width: 0; margin: 0 -35px 0 -20px; }
svg { display: block; width: 100%; height: auto; overflow: hidden; }
.ride-controls { display: flex; align-items: center; gap: 16px; width: 280px; max-width: 100%; margin: 0; padding: 12px 16px 12px 12px; border: 1px solid #d4ddcd; border-radius: 20px; background: #fffdf4; box-shadow: 0 3px 0 #e2e5d6, 0 8px 20px #263e4006; }
.ride-control { display: grid; place-items: center; flex: 0 0 48px; width: 48px; height: 48px; padding: 0; border: 1px solid #216f69; border-radius: 15px; background: var(--teal); color: #fffdf4; box-shadow: inset 0 1px 0 #ffffff30, 0 3px 0 #205e58; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background .18s ease, box-shadow .18s ease, transform .18s ease; }
.control-disc { display: grid; place-items: center; }
.control-disc svg { width: 18px; height: 18px; overflow: visible; }
.control-play { display: none; }
.paused .control-pause { display: none; }
.paused .control-play { display: block; }
.ride-control:focus-visible { outline: 2px solid #27807880; outline-offset: 5px; }
@media (hover: hover) {
  .ride-control:hover { background: #226f68; transform: translateY(-1px); box-shadow: inset 0 1px 0 #ffffff30, 0 4px 0 #205e58; }
}
.ride-control:active { transform: translateY(2px); box-shadow: inset 0 1px 0 #ffffff20, 0 1px 0 #205e58; }
.speed-control { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 10px; flex: 1; min-width: 0; }
.speed-control label { color: var(--muted); font-size: 14px; line-height: 24px; }
.speed-control output { grid-column: 2; grid-row: 1; min-width: 3.4em; padding: 0 7px; border-radius: 6px; background: #2780780d; color: var(--teal); font-size: 14px; line-height: 24px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: center; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
.speed-slider { --progress: 33.333%; grid-column: 1 / -1; grid-row: 2; display: block; width: 100%; min-width: 0; height: 26px; margin: 0; appearance: none; -webkit-appearance: none; background: transparent; cursor: pointer; }
.speed-slider::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(to right, var(--teal) var(--progress), #d6dfd1 var(--progress)); }
.speed-slider::-moz-range-track { height: 4px; border-radius: 4px; background: linear-gradient(to right, var(--teal) var(--progress), #d6dfd1 var(--progress)); }
.speed-slider::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border: 3px solid #fffdf4; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 1px #27807870, 0 2px 3px #263e4015; }
.speed-slider::-moz-range-thumb { width: 10px; height: 10px; border: 3px solid #fffdf4; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 1px #27807870, 0 2px 3px #263e4015; }
.speed-slider:focus-visible { outline: 2px solid #27807880; outline-offset: 3px; border-radius: 8px; }
@media (prefers-reduced-motion: reduce) { .ride-control, .control-disc { transition: none; } }
footer { display: flex; justify-content: space-between; gap: 20px; padding-top: 20px; border-top: 1px solid #ded8c7; font-size: 14px; color: var(--muted); line-height: 1.6; }
.paused *, .hidden * { animation-play-state: paused !important; }
@media (max-width: 760px) {
  main { padding: 24px 24px 20px; }
  .scene { grid-template-columns: 1fr; gap: 0; padding-top: 40px; }
  .copy { width: fit-content; max-width: 100%; margin-inline: auto; text-align: left; padding-bottom: 0; }
  h1 { font-size: clamp(36px, 8vw, 54px); margin-bottom: 16px; }
  .copy p { margin-bottom: 22px; }
  .art { margin: 0 -20px; }
  footer { font-size: 14px; flex-wrap: wrap; gap: 6px; }
}
</style>
</head>
<body>
<main>
<header class="masthead">风起鹈行</header>
<section class="scene" aria-labelledby="headline">
<div class="copy">
<h1 id="headline">慢慢骑，<br>风景会等你。</h1>
<p>把忙碌留在身后，<br>跟着鹈鹕，去微风里兜一圈。<br>今天的目的地，是好心情。</p>
<div class="ride-controls" role="group" aria-label="骑行动画控制">

</div>
</div>
</div>

  <circle cx="466" cy="526" r="7" fill="#263e40"/>

  <g id="grip-fold" transform="translate(0 20)">

  <path d="M616 151l213 27q-41 70-118 62-54-6-91-64z" fill="#eaa447" stroke="#263e40" stroke-width="5" stroke-linejoin="round"/>

</section>
<footer><span>不赶路，感受路。</span><span>有阳光，有微风，还有一点自在。</span></footer>
</main>
<script>
const stage = document.querySelector('main');
const button = document.querySelector('#toggle');
const label = document.querySelector('#button-label');
const speedSlider = document.querySelector('#speed');
const speedValue = document.querySelector('#speed-value');
const preference = matchMedia('(prefers-reduced-motion: reduce)');
const ids = ['near-leg', 'near-leg-outline', 'far-leg', 'near-foot', 'far-foot', 'near-crank', 'far-crank', 'scarf', 'eye'];
const parts = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));
const rider = document.querySelector('.rider');
const holdingWing = document.getElementById('holding-wing');
const gripFold = document.getElementById('grip-fold');
const wheels = [...document.querySelectorAll('.wheel')];
// Ground speed matches tire circumference; scenery uses depth-dependent parallax.
const groundRate = 2 * Math.PI * 125 * 1.6 / 1800;
const scenery = [
  { element: document.querySelector('.road'), rate: groundRate },
  { element: document.getElementById('distant-world'), rate: groundRate * .12 },
  { element: document.querySelector('.wind'), rate: groundRate * 1.25 }
];
const wind = document.querySelector('.wind');
const leaves = [
  { duration: 1850, offset: .9, ground: 690, lift: 17, size: 1 },
  { duration: 1980, offset: .68, ground: 709, lift: 12, size: .8 },
  { duration: 1720, offset: .47, ground: 678, lift: 20, size: .9 },
  { duration: 2050, offset: .3, ground: 718, lift: 10, size: .7 },
  { duration: 1820, offset: .14, ground: 690, lift: 16, size: .85 },
  { duration: 1920, offset: .04, ground: 707, lift: 14, size: .65 }
].map((leaf, index) => ({ ...leaf, element: document.getElementById(`leaf-${index}`) }));
let speed = Number(speedSlider.value);
const paceScale = .8;
let paused = preference.matches;
let elapsed = 0;
let previous = null;
let frame = null;

// Two fixed-length segments meet at a knee bent toward the handlebars.
function legPath(hipX, hipY, ankleX, ankleY) {
  const upper = 100, lower = 110;
  const dx = ankleX - hipX, dy = ankleY - hipY;
  const distance = Math.hypot(dx, dy);
  const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
  const height = Math.sqrt(Math.max(0, upper * upper - along * along));
  const kneeX = hipX + along * dx / distance + height * dy / distance;
  const kneeY = hipY + along * dy / distance - height * dx / distance;
  return `M${hipX} ${hipY}L${kneeX} ${kneeY}L${ankleX} ${ankleY}`;
}
function render(time) {
  const angle = time / 1800 * Math.PI * 2 + Math.PI / 3;
  const bob = -22 + 2 * Math.cos(angle * 2);
  rider.setAttribute('transform', `translate(0 ${bob})`);
  // Cancel the body's vertical offset at the grip, with a flexible elbow between.
  holdingWing.setAttribute('d', `M535 278C558 293 581 ${304 - bob * .7} 606 ${301 - bob * .85}C626 ${301 - bob} 641 ${289 - bob} 655 ${287 - bob}Q669 ${278 - bob} 680 ${284 - bob}Q688 ${289 - bob} 686 ${297 - bob}Q685 ${303 - bob} 680 ${303 - bob}Q675 ${302 - bob} 675 ${294 - bob}C650 ${300 - bob} 637 ${319 - bob} 612 ${320 - bob * .85}Q574 ${326 - bob * .45} 539 311`);
  gripFold.setAttribute('transform', `translate(0 ${-bob})`);
  for (const [side, offset, hipX, hipY] of [['near', 0, 456, 384], ['far', Math.PI, 492, 382]]) {
    const x = 466 + 48 * Math.cos(angle + offset);
    const y = 526 + 48 * Math.sin(angle + offset);
    const path = legPath(hipX, hipY + bob, x - 12, y - 14);
    parts[`${side}-leg`].setAttribute('d', path);
    if (side === 'near') parts['near-leg-outline'].setAttribute('d', path);
    parts[`${side}-foot`].setAttribute('transform', `translate(${x} ${y})`);
    parts[`${side}-crank`].setAttribute('d', `M466 526L${x} ${y}`);
  }
  wheels.forEach(wheel => wheel.setAttribute('transform', `rotate(${time / 1800 * 360 * 1.6} ${wheel.getAttribute('cx')} 526)`));
  parts.scarf.setAttribute('transform', `rotate(${Math.sin(angle * 2) * 3} 542 239)`);
  const blinkTime = time % 5100;
  const eyeScale = blinkTime > 4700 && blinkTime < 4900 ? 1 - .92 * Math.sin((blinkTime - 4700) / 200 * Math.PI) : 1;
  parts.eye.setAttribute('transform', `translate(599 140) scale(1 ${eyeScale}) translate(-599 -140)`);
  scenery.forEach(({ element, rate }) => {
    element.setAttribute('transform', `translate(${-((time * rate) % 1000)} 0)`);
  });
  wind.setAttribute('opacity', .16 + .34 * (speed - .5) / 1.5);
  wind.setAttribute('stroke-width', 1.5 + speed * .4);
  leaves.forEach(({ element, duration, offset, ground, lift, size }) => {
    const phase = (time / duration + offset) % 1;
    const flutter = time / 900 + offset * Math.PI * 2;
    // Uneven gusts lift the leaves briefly, then let them settle toward the road.
    const hop = Math.pow(Math.max(0, Math.sin(flutter)), 2);
    const x = 1050 - 1100 * phase + 8 * Math.sin(flutter);
    const y = ground - lift * hop;
    const tilt = -18 + 32 * Math.sin(flutter + .5);
    const fold = .5 + .5 * Math.abs(Math.cos(flutter * .8));
    element.setAttribute('transform', `translate(${x} ${y}) rotate(${tilt}) scale(${size} ${size * fold})`);

  });
}
function tick(now) {
  if (previous !== null) elapsed += Math.min(now - previous, 64) * speed * paceScale;
  previous = now;
  render(elapsed);
  frame = requestAnimationFrame(tick);
}
function syncPlayback() {
  cancelAnimationFrame(frame);
  previous = null;
  stage.classList.toggle('paused', paused);
  stage.classList.toggle('hidden', document.hidden);
  label.textContent = paused ? '继续骑行' : '暂停动画';
  button.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
  button.title = paused ? '继续骑行' : '暂停动画';
  if (!paused && !document.hidden) frame = requestAnimationFrame(tick);
}
button.addEventListener('click', () => { paused = !paused; syncPlayback(); });
speedSlider.addEventListener('input', () => {
  speed = Number(speedSlider.value);
  speedValue.textContent = `${speed.toFixed(1)}×`;
  speedSlider.setAttribute('aria-valuetext', `${speed.toFixed(1)} 倍速度`);
  speedSlider.style.setProperty('--progress', `${(speed - .5) / 1.5 * 100}%`);
});
preference.addEventListener('change', event => { paused = event.matches; syncPlayback(); });
document.addEventListener('visibilitychange', syncPlayback);
render(0);
syncPlayback();
</script>
</body>
</html>
